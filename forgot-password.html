<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Tunefry</title>
<link rel="icon" type="image/png" href="PHOTOS/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
:root{
  --bg:#090807; --s1:#111009; --s2:#161410;
  --t1:#fff; --t2:rgba(255,255,255,0.62); --t3:rgba(255,255,255,0.38);
  --or:#FF6B00; --or-d:rgba(255,107,0,0.12); --or-b:rgba(255,107,0,0.28);
  --bd:rgba(255,255,255,0.08); --bd2:rgba(255,255,255,0.13);
  --green:#22C55E;
  --font-d:'Syne',sans-serif; --font-b:'DM Sans',sans-serif;
}
body{
  font-family:var(--font-b); background:var(--bg); color:var(--t1);
  min-height:100vh; display:flex; flex-direction:column;
  background-image:
    radial-gradient(ellipse 70% 50% at 70% 0%, rgba(255,107,0,0.10) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 20% 80%, rgba(168,85,247,0.05) 0%, transparent 55%);
}
a{text-decoration:none;color:inherit}
.top-nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 40px; flex-shrink:0;
}
.nav-logo{display:flex;align-items:center;gap:10px;}
.nav-right{font-size:13px;color:var(--t2);}
.nav-right a{color:var(--or);font-weight:600;margin-left:6px;transition:opacity .2s;}
.nav-right a:hover{opacity:.8;}
.main{
  flex:1; display:grid;
  grid-template-columns:1fr min(480px, 100% - 32px) 1fr;
  align-items:center; padding:20px 40px 48px;
}
.card-col{grid-column:2;}
.auth-card{
  background:linear-gradient(165deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.025) 60%, rgba(255,255,255,0.01) 100%);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:0.5px solid rgba(255,255,255,0.12);
  border-radius:22px;
  box-shadow:0 24px 80px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
  padding:40px 40px 36px;
}
.auth-eyebrow{
  font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--or);margin-bottom:10px;
}
.auth-title{font-family:var(--font-d);font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
.auth-sub{font-size:13.5px;color:var(--t2);margin-bottom:32px;line-height:1.55;}
.form-group{margin-bottom:16px;}
.form-label{
  display:block;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.8px;
  color:var(--t2);margin-bottom:7px;
}
.form-input{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,0.05);
  border:0.5px solid rgba(255,255,255,0.10);
  border-radius:12px;font-size:14px;color:var(--t1);
  font-family:var(--font-b);outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.form-input:focus{border-color:rgba(255,107,0,0.55);box-shadow:0 0 0 3px rgba(255,107,0,0.1);}
.form-input::placeholder{color:var(--t3);}
.btn-submit{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#FF8A50,var(--or),#CC5500);
  color:#fff;border:none;border-radius:12px;
  font-family:var(--font-d);font-size:15px;font-weight:800;
  letter-spacing:.02em;cursor:pointer;
  box-shadow:0 6px 24px rgba(255,107,0,0.38), inset 0 1px 0 rgba(255,255,255,0.18);
  transition:opacity .2s, transform .2s, box-shadow .2s;
  margin-top:8px;
}
.btn-submit:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 10px 32px rgba(255,107,0,0.45);}
.btn-submit:active{transform:none;}
.auth-bottom{text-align:center;margin-top:24px;font-size:13px;color:var(--t2);}
.auth-bottom a{color:var(--or);font-weight:600;margin-left:5px;transition:opacity .2s;}
.auth-bottom a:hover{opacity:.8;}
.auth-footer{
  text-align:center;padding:16px 40px 24px;
  font-size:12px;color:var(--t3);
}
.auth-footer a{color:var(--t3);margin:0 8px;transition:color .2s;}
.auth-footer a:hover{color:var(--t1);}
/* Success state */
.success-wrap{display:none;text-align:center;}
.success-icon{
  width:64px;height:64px;border-radius:50%;
  background:rgba(34,197,94,0.12);border:0.5px solid rgba(34,197,94,0.3);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
}
.success-icon svg{width:28px;height:28px;stroke:var(--green);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.success-title{font-family:var(--font-d);font-size:22px;font-weight:800;margin-bottom:8px;}
.success-sub{font-size:13.5px;color:var(--t2);line-height:1.55;margin-bottom:28px;}
.success-sub strong{color:var(--t1);}
@media(max-width:560px){
  .main{grid-template-columns:1fr;padding:16px 20px 40px;}
  .card-col{grid-column:1;}
  .auth-card{padding:28px 22px 24px;}
  .top-nav{padding:16px 20px;}
}
* { -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none; }
input,textarea,[contenteditable] { -webkit-user-select:text; -moz-user-select:text; user-select:text; }
</style>

</head>
<body>

<nav class="top-nav">
  <a href="home.html" class="nav-logo">
    <img src="PHOTOS/tunefry-logo.png" alt="Tunefry" style="height:38px;width:auto;display:block;object-fit:contain;">
  </a>
  <div class="nav-right">
    Remember it?<a href="login.html">Log in</a>
  </div>
</nav>

<div class="main">
  <div class="card-col">
    <div class="auth-card">

      <!-- Form state -->
      <div id="fpFormWrap">
        <div class="auth-eyebrow">Account Recovery</div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-sub">Enter your registered email and we'll send you a reset link.</p>

        <form id="fpForm" onsubmit="handleReset(event)" novalidate>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="fpEmail" class="form-input" placeholder="you@email.com" autocomplete="email">
          </div>
          <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

        <div class="auth-bottom">
          <span style="color:var(--t2);">Back to</span>
          <a href="login.html">Log in →</a>
        </div>
      </div>

      <!-- Success state -->
      <div class="success-wrap" id="fpSuccess">
        <div class="success-icon">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="success-title">Check your inbox</div>
        <p class="success-sub">We've sent a reset link to <strong id="sentTo"></strong>. It may take a few minutes to arrive.</p>
        <a href="login.html" class="btn-submit" style="display:block;text-align:center;text-decoration:none;">Back to Login</a>
      </div>

    </div>
  </div>
</div>

<footer class="auth-footer">
  &copy; 2026 Tunefry Artist Services Pvt. Ltd.
  <a href="home.html">Home</a>
  <a href="pricing.html">Pricing</a>
  <a href="mailto:support@tunefry.com">Support</a>
</footer>

<script>
function handleReset(e) {
  e.preventDefault();
  var email = document.getElementById('fpEmail').value.trim();
  if (!email || !email.includes('@')) {
    document.getElementById('fpEmail').style.borderColor = 'rgba(239,68,68,0.6)';
    document.getElementById('fpEmail').style.boxShadow = '0 0 0 3px rgba(239,68,68,0.1)';
    return;
  }
  var btn = e.target.querySelector('.btn-submit');
  btn.textContent = 'Sending…';
  btn.style.opacity = '0.7';
  btn.disabled = true;
  setTimeout(function() {
    document.getElementById('fpFormWrap').style.display = 'none';
    document.getElementById('sentTo').textContent = email;
    document.getElementById('fpSuccess').style.display = 'block';
  }, 800);
}

document.getElementById('fpEmail').addEventListener('input', function() {
  this.style.borderColor = '';
  this.style.boxShadow = '';
});
</script>
</body>
</html>
